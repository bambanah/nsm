services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: nsm
      POSTGRES_PASSWORD: postgres
    ports:
      - 5434:5432
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U postgres
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
